spring.application.name=backend
spring.datasource.url=jdbc:mysql://localhost:3306/aerodb?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=suhaib
spring.datasource.password=integral
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP (default connection pool in Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
